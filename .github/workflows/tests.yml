# 테스트 · 리눅스 설치 스크립트 검사 — main 에 올리거나 PR 을 열 때마다
name: tests
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: 테스트
        run: python -m pytest -q tests

  linux-install:
    # 설치 스크립트를 실제로 끝까지 돌려 봐요: 서비스가 뜨고 · 비밀번호 로그인이 되고 · strabot 명령이 도는지
    name: install.sh (Ubuntu · systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 셸 문법 · shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck >/dev/null
          bash -n scripts/install.sh scripts/strabot
          shellcheck -S warning scripts/install.sh scripts/strabot
      - name: 설치 (이 저장소의 이 커밋으로)
        run: |
          git checkout -q -B ci-install
          sudo git config --global --add safe.directory '*'
          sudo env STRABOT_REPO="file://$GITHUB_WORKSPACE" STRABOT_BRANCH=ci-install STRABOT_DASHBOARD_PASSWORD='ci-password-1' STRABOT_PORT=5001 bash scripts/install.sh
      - name: 서비스 · 로그인 확인
        run: |
          set -x
          strabot status
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5001/login && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/login)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/api/status)" = 401
          test "$(curl -s -c /tmp/cj -o /dev/null -w '%{http_code}' -d 'password=ci-password-1' http://127.0.0.1:5001/login)" = 302
          test "$(curl -s -b /tmp/cj -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/api/status)" = 200
          test "$(curl -s -b /tmp/cj -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/)" = 200
      - name: strabot update · restart · uninstall
        run: |
          set -x
          sudo strabot update
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5001/login && break; sleep 1; done
          sudo strabot restart
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:5001/login && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5001/login)" = 200
          sudo journalctl -u strabot --no-pager -n 40
          sudo strabot uninstall -y
          test ! -d /opt/strabot
          sudo test -f /var/lib/strabot/data/dashboard_auth.json
      - name: 실패하면 로그
        if: failure()
        run: sudo journalctl -u strabot --no-pager -n 200 || true
